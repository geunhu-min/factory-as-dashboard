          setMonthlyClosingStatus_("추가건정리 완료: 정리 " + data.newRowCount + "건", "ok");
        } catch (error) {
          setMonthlyClosingStatus_("추가건정리 실패: " + error.message, "error");
        } finally {
          el.monthlyClosingCleanupAddedBtn.disabled = false;
        }
      }

      // "브랜드별정리" 버튼 — "정리" 시트(추가건정리로 이미 만들어져
      // 있어야 함)를 접수번호 앞글자 기준으로 나눠 퍼시스/일룸/
      // 퍼시스내역서/일룸내역서 시트에 각각 덮어씁니다.
      async function cleanupByBrand() {
        const url = el.monthlyClosingWebappUrl.value.trim();

        if (!url) {
          setMonthlyClosingStatus_("충주2유상마감 웹 앱 URL을 먼저 입력하고 저장하세요.", "error");
          return;
        }

        if (!confirm(
          "브랜드별 정리를 시작합니다.\n" +
          "정리시트의 진행상태가 '입고완료'인지 금액부분 누락이 없는지 확인 후 진행해주세요."
        )) return;

        setMonthlyClosingStatus_("브랜드별정리 실행 중...", "");
        el.monthlyClosingCleanupByBrandBtn.disabled = true;
        setRunBadge_(el.monthlyClosingCleanupByBrandRunBadge, "running");

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "cleanupByBrand" })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          const vendorCounts = data.vendorCounts || {};
          const vendorSummary = Object.keys(vendorCounts)
            .map(function(name) { return name + " " + vendorCounts[name] + "건"; })
            .join(", ");

          setMonthlyClosingStatus_("브랜드별정리 완료: " + vendorSummary, "ok");
          setRunBadge_(el.monthlyClosingCleanupByBrandRunBadge, "done");

          await loadMonthlyClosingData();
        } catch (error) {
          setMonthlyClosingStatus_("브랜드별정리 실패: " + error.message, "error");
          setRunBadge_(el.monthlyClosingCleanupByBrandRunBadge, "error");
        } finally {
          el.monthlyClosingCleanupByBrandBtn.disabled = false;
        }
      }

      async function downloadMonthlyClosingSubset_(action, buttonEl, label) {
        const url = el.monthlyClosingWebappUrl.value.trim();

        if (!url) {
          setMonthlyClosingStatus_("충주2유상마감 웹 앱 URL을 먼저 입력하고 저장하세요.", "error");
          return;
        }

        setMonthlyClosingStatus_(label + " 다운로드 중...", "");
        buttonEl.disabled = true;

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: action })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          downloadBase64File_(data.base64, data.fileName);
          setMonthlyClosingStatus_(label + " 다운로드 완료: " + data.fileName, "ok");
        } catch (error) {
          setMonthlyClosingStatus_(label + " 다운로드 실패: " + error.message, "error");
        } finally {
          buttonEl.disabled = false;
        }
      }

      function downloadPaidClosing() {
        return downloadMonthlyClosingSubset_("exportPaidClosing", el.monthlyClosingDownloadBtn, "유상마감");
      }

      function downloadPaidClosingDetail() {
        return downloadMonthlyClosingSubset_("exportPaidClosingDetail", el.monthlyClosingDownloadDetailBtn, "유상마감내역서");
      }

      function setStatus(message, kind) {
        el.statusLine.textContent = message || "";
        el.statusLine.className = "status-line" + (kind ? " " + kind : "");
      }

      function getConfig() {
        return {
          url: el.webappUrl.value.trim()
        };
      }

      function isMonthlyReadOnlyTab() {
        return state.currentSheet === MONTHLY_SUMMARY_KEY ||
          state.currentSheet === MONTHLY_CLOSING_KEY ||
          state.currentSheet === MONTHLY_RAW_DATA_KEY ||
          getMonthlyWeekNumber(state.currentSheet) !== null;
      }

      function isReadOnlyTab() {
        return isMonthlyReadOnlyTab() || isRecoveryTab() || isDeleteSheetTab() || isAddSheetTab() ||
          isRecoveryMatchTab() || isOpenAsSheetTab() || isClaimDashboardTab();
      }

      function refreshActionButtonsVisibility() {
        const readOnly = isReadOnlyTab();
        const isMatchTab = isRecoveryMatchTab();
        const isStatusTab = isOpenAsSheetTab();
        const isDeleteTab = isDeleteSheetTab();
        const isClaimTab = isClaimDashboardTab();

        el.runCleanupBtn.style.display = readOnly ? "none" : "";
        el.saveRowsBtn.style.display = readOnly ? "none" : "";
        el.dirtyCount.style.display = readOnly ? "none" : "";
        el.recoveryMatchToolbarBtn.style.display = isMatchTab ? "" : "none";
        el.accumulatedMatchToolbarBtn.style.display = isMatchTab ? "" : "none";
        el.clearMonthlyDataToolbarBtn.style.display = isMonthlySummaryTab() ? "" : "none";
        el.openAsSheetToolbarBtn.style.display = isStatusTab ? "" : "none";
        el.cleanupBothToolbarBtn.style.display = isStatusTab ? "" : "none";
        el.removeDeletedToolbarBtn.style.display = isDeleteTab ? "" : "none";
        el.claimUpdateWeeklyBtn.style.display = isClaimTab ? "" : "none";
        el.claimReshapeMonthBtn.style.display = isClaimTab ? "" : "none";
      }

      async function loadRecoverySheet_() {
        const csvUrl = el.recoveryCsvUrl.value.trim();

        if (!csvUrl) {
          setStatus("회수누적 웹에 게시 주소를 먼저 입력하고 저장하세요.", "error");
          return;
        }

        state.currentSheet = RECOVERY_KEY;
        refreshActionButtonsVisibility();

        setStatus("불러오는 중...", "");
        state.loading = true;
        el.saveRowsBtn.disabled = true;

        try {
          // 로컬 서버가 없으면(정적 호스팅) CORS 우회 프록시도 없으므로
          // 구글 게시 CSV 주소를 직접 요청합니다(구글이 이 요청에
          // Access-Control-Allow-Origin을 허용해주는 경우에만 됩니다 —
          // 안 되면 아래 catch에서 에러로 안내).
          const requestUrl = hasLocalConfigServer_
            ? "/api/google-published-csv?url=" + encodeURIComponent(csvUrl)
            : csvUrl;
          const response = await fetch(requestUrl);
          const text = await response.text();

          if (!response.ok) {
            let message = text;
            try { message = JSON.parse(text).error || text; } catch (_) {}
            throw new Error(message);
          }

          const rows = parseCsv(text);

          if (!rows.length) {
            state.header = [];
            state.rows = [];
            renderTable();
            setStatus("데이터 없음", "");
            return;
          }

          state.header = rows[0];
          state.rows = rows.slice(1).map(function(row, i) {
            return { rowIndex: i + 2, loaded: row.slice(), current: row.slice() };
          });

          renderTable();
          setStatus(state.rows.length + "건 불러왔습니다.", "ok");
        } catch (error) {
          // loadSheet()와 같은 이유로, 실패 시 이전 탭 데이터가 남아
          // "회수누적" 탭 것처럼 보이지 않도록 표를 비웁니다.
          state.header = [];
          state.rows = [];
          renderTable();
          setStatus("불러오기 실패: " + error.message, "error");
        } finally {
          state.loading = false;
        }
      }

      let claimDashboardBlobUrl = null;

      function showClaimDashboardViewer_(show) {
        el.claimDashboardViewer.hidden = !show;
        el.tableWrap.hidden = show;

        if (show) {
          el.monthlyCountsBar.hidden = true;
        } else {
          setClaimDashboardPdf_(null); // 탭을 벗어나면 blob URL을 정리
        }
      }

      function setClaimDashboardPdf_(base64) {
        if (claimDashboardBlobUrl) {
          URL.revokeObjectURL(claimDashboardBlobUrl);
          claimDashboardBlobUrl = null;
        }

        if (!base64) {
          el.claimDashboardFrame.src = "about:blank";
          return;
        }

        const byteCharacters = atob(base64);
        const byteNumbers = new Array(byteCharacters.length);

        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }

        const blob = new Blob([new Uint8Array(byteNumbers)], { type: "application/pdf" });

        claimDashboardBlobUrl = URL.createObjectURL(blob);
        el.claimDashboardFrame.src = claimDashboardBlobUrl;
      }

      async function loadClaimDashboardSheet_() {
        const url = el.claimDashboardWebappUrl.value.trim();

        if (!url) {
          setStatus("클레임 대시보드 웹 앱 URL을 먼저 입력하고 저장하세요.", "error");
          return;
        }

        state.currentSheet = CLAIM_DASHBOARD_KEY;
        refreshActionButtonsVisibility();
        showClaimDashboardViewer_(true);

        setStatus("불러오는 중... (표가 커서 시간이 걸릴 수 있습니다)", "");
        state.loading = true;

        try {
          const requestUrl = url + (url.includes("?") ? "&" : "?") + "action=read";
          const response = await fetch(requestUrl);
          const data = await response.json();

          if (data.error) throw new Error(data.error);

          if (!data.pdfBase64) {
            setClaimDashboardPdf_(null);
            setStatus("데이터 없음", "");
            return;
          }

          setClaimDashboardPdf_(data.pdfBase64);
          setStatus("불러왔습니다.", "ok");
        } catch (error) {
          setClaimDashboardPdf_(null);
          setStatus("불러오기 실패: " + error.message, "error");
        } finally {
          state.loading = false;
        }
      }

      async function loadSheet(sheetName) {
        if (sheetName !== CLAIM_DASHBOARD_KEY) {
          showClaimDashboardViewer_(false);
        }

        if (sheetName === RECOVERY_KEY) {
          await loadRecoverySheet_();
          return;
        }

        if (sheetName === CLAIM_DASHBOARD_KEY) {
          await loadClaimDashboardSheet_();
          return;
        }

        const weekNumber = getMonthlyWeekNumber(sheetName);
        const isMonthlySummary = sheetName === MONTHLY_SUMMARY_KEY;
        const isMonthlyClosing = sheetName === MONTHLY_CLOSING_KEY;
        const isMonthlyRawData = sheetName === MONTHLY_RAW_DATA_KEY;
        const isMonthly = isMonthlySummary || isMonthlyClosing || isMonthlyRawData || weekNumber !== null;

        const requestBaseUrl = isMonthly
          ? el.monthlyWebappUrl.value.trim()
          : getConfig().url;

        if (!requestBaseUrl) {
          setStatus(
            isMonthly
              ? "월현황(주간) 웹 앱 URL을 먼저 입력하고 저장하세요."
              : "웹 앱 URL을 먼저 입력하고 저장하세요.",
            "error"
          );
          return;
        }

        state.currentSheet = sheetName;
        refreshActionButtonsVisibility();

        setStatus("불러오는 중...", "");
        state.loading = true;
        el.saveRowsBtn.disabled = true;

        try {
          const isOpenAsSheet = sheetName === OPEN_AS_SHEET_KEY;

          const actualSheetName = sheetName === RECOVERY_MATCH_KEY
            ? RECOVERY_MATCH_SHEET_NAME
            : sheetName;

          const actionQuery = isMonthlySummary
            ? "action=summary"
            : isMonthlyClosing
              ? "action=closing"
              : isMonthlyRawData
                ? "action=rawData"
                : weekNumber !== null
                  ? "action=weekByNumber&week=" + weekNumber
                  : isOpenAsSheet
                    ? "action=currentWeekStatus"
                    : "sheet=" + encodeURIComponent(actualSheetName);

          const requestUrl = requestBaseUrl +
            (requestBaseUrl.includes("?") ? "&" : "?") + actionQuery;

          const response = await fetch(requestUrl);
          const data = await response.json();

          if (data.error) throw new Error(data.error);

          if ((isMonthly || isOpenAsSheet) && !data.sheet) {
            state.header = [];
            state.rows = [];
            renderTable();
            setStatus("데이터 없음", "");
            return;
          }

          state.header = data.header || [];
          state.rows = (data.rows || []).map(function(row) {
            return {
              rowIndex: row.rowIndex,
              loaded: row.values.slice(),
              current: row.values.slice()
            };
          });

          renderTable();
          setStatus(state.rows.length + "건 불러왔습니다.", "ok");
        } catch (error) {
          // 실패했는데 이전 탭 내용이 표에 그대로 남아있으면, state.currentSheet는
          // 이미 새 탭으로 바뀐 상태라 어느 탭 데이터인지 헷갈리고 그 상태로
          // 저장/삭제를 누르면 엉뚱한 탭 기준으로 동작할 수 있습니다. 표를
          // 비워서 "지금 아무 데이터도 없는" 상태를 명확히 보여줍니다.
          state.header = [];
          state.rows = [];
          renderTable();
          setStatus("불러오기 실패: " + error.message, "error");
        } finally {
          state.loading = false;
        }
      }

      const LEADING_COLUMNS = 1; // 대시보드에서만 앞에 붙이는 "구분"(순번) 열

      function renderTable() {
        el.thead.innerHTML = "";

        const seqTh = document.createElement("th");
        seqTh.textContent = "구분";
        el.thead.appendChild(seqTh);

        state.header.forEach(function(label) {
          const th = document.createElement("th");
          th.textContent = label || "";
          el.thead.appendChild(th);
        });

        const dateColIndexes = DATE_COLUMN_LABELS
          .map(function(label) { return state.header.indexOf(label); })
          .filter(function(i) { return i !== -1; });

        const narrowColIndexes = NARROW_COLUMN_LABELS
          .map(function(label) { return state.header.indexOf(label); })
          .filter(function(i) { return i !== -1; });

        const amountColIndexes = AMOUNT_COLUMN_LABELS
          .map(function(label) { return state.header.indexOf(label); })
          .filter(function(i) { return i !== -1; });

        const readOnly = isReadOnlyTab();
        // 원본 구글시트(monthly-weekly-webapp.gs의 applyPackageFontColors_)와
        // 같은 기준으로, 포장이 VN/미회수인 행은 화면에서도 같은 색으로
        // 표시합니다(1/2공장추가건, 월현황/마감/로데이터/N주 전부 이 표를
        // 같이 씀).
        const packageColIndexForColor = state.header.indexOf(PACKAGE_COLUMN_LABEL);

        el.tbody.innerHTML = "";
        state.rows.forEach(function(row, rowPos) {
          const tr = document.createElement("tr");
          tr.dataset.rowIndex = row.rowIndex;

          if (packageColIndexForColor !== -1) {
            const packageCategory = classifyPackage_(row.current[packageColIndexForColor]);
            if (packageCategory === "vn") {
              tr.style.color = "#1155cc";
            } else if (packageCategory === "uncollected") {
              tr.style.color = "#cc0000";
            }
          }

          const seqTd = document.createElement("td");
          seqTd.textContent = String(rowPos + 1);
          seqTd.contentEditable = "false";
          seqTd.classList.add("seq-cell");
          tr.appendChild(seqTd);

          row.current.forEach(function(cellValue, colIndex) {
            const td = document.createElement("td");
            td.contentEditable = readOnly ? "false" : "true";

            const isDateCol = dateColIndexes.indexOf(colIndex) !== -1 || looksLikeIsoDateTime_(cellValue);
            const isNarrowCol = narrowColIndexes.indexOf(colIndex) !== -1;
            const isAmountCol = amountColIndexes.indexOf(colIndex) !== -1;
            const rawDisplayValue = isDateCol
              ? formatDateKST(cellValue)
              : isAmountCol
                ? formatAmount_(cellValue)
                : (cellValue === null || cellValue === undefined ? "" : cellValue);

            // 날짜 칸에 시트 자체에 남아있는 "#######"류 깨진 텍스트가
            // 그대로 들어있으면(formatDateKST가 날짜로 못 읽어서 원본
            // 문자열을 그대로 반환한 경우) 매우 길어서 칸이 과도하게
            // 넓어지는 문제가 있었습니다. 편집 가능한 표는 화면 글자를
            // 그대로 저장에 쓰기도 해서 건드리지 않고, 읽기 전용 표에서만
            // "2026-08-03" 정도 길이로 잘라서 보여줍니다.
            const DATE_DISPLAY_MAX_LENGTH = 12;
            const displayValue = (isDateCol && readOnly && String(rawDisplayValue).length > DATE_DISPLAY_MAX_LENGTH)
              ? String(rawDisplayValue).slice(0, DATE_DISPLAY_MAX_LENGTH) + "…"
              : rawDisplayValue;

            td.textContent = displayValue;

            if (isNarrowCol) {
              td.classList.add("narrow-hover-cell");
              td.title = String(displayValue);
            }

            td.addEventListener("input", function() {
              row.current[colIndex] = isAmountCol ? stripAmountFormatting_(td.textContent) : td.textContent;
              if (isNarrowCol) td.title = td.textContent;
              updateDirtyState(rowPos, tr);
            });
            tr.appendChild(td);
          });

          el.tbody.appendChild(tr);
        });

        if (narrowColIndexes.length) {
          applyNarrowColumnWidths_(state.header, narrowColIndexes, el.thead, el.tbody);
        }

        renderMonthlyCountsBar();
        updateDirtyCount();
      }

      const PACKAGE_COLUMN_LABEL = "포장";

      // 충주 = 1/4/7라인(내작) + 외주(외작)
      function classifyPackage_(value) {
        const text = String(value === null || value === undefined ? "" : value).trim();

        if (/^[147]\s*라인$/.test(text)) return "inner";
        if (/^외주/.test(text)) return "outer"; // "외주(성진)"처럼 뒤에 업체명이 붙어도 포함
        if (text === "VN") return "vn";
        if (text === "미회수") return "uncollected";
        return null;
      }

      function renderMonthlyCountsBar() {
        if (isRecoveryTab()) {
          el.monthlyCountsBar.hidden = true;
          return;
        }

        const packageColIndex = state.header.indexOf(PACKAGE_COLUMN_LABEL);

        if (packageColIndex === -1) {
          el.monthlyCountsBar.hidden = true;
          return;
        }

        let innerCount = 0;
        let outerCount = 0;
        let vnCount = 0;
        let uncollectedCount = 0;

        state.rows.forEach(function(row) {
          const category = classifyPackage_(row.current[packageColIndex]);
          if (category === "inner") innerCount++;
          else if (category === "outer") outerCount++;
          else if (category === "vn") vnCount++;
          else if (category === "uncollected") uncollectedCount++;
        });

        const chungjuCount = innerCount + outerCount;
        const totalCount = chungjuCount + vnCount + uncollectedCount;

        el.monthlyCountsBar.innerHTML =
          "<span><span class=\"count-label\">합계</span>" + totalCount + "건</span>" +
          "<span><span class=\"count-label\">충주</span>" + chungjuCount + "건 (내작 " + innerCount + "건, 외작 " + outerCount + "건)</span>" +
          "<span><span class=\"count-label\">VN</span>" + vnCount + "건</span>" +
          "<span><span class=\"count-label\">미회수</span>" + uncollectedCount + "건</span>";

        el.monthlyCountsBar.hidden = false;
      }

      // 헤더 글자에 정렬 화살표 같은 부가 기호가 붙어있어도 찾을 수 있도록
      // 정확히 일치하는 열이 없으면 라벨을 포함하는 열을 찾습니다.
      function findHeaderIndex_(header, label) {
        const exact = header.indexOf(label);
        if (exact !== -1) return exact;

        for (let i = 0; i < header.length; i++) {
          if (String(header[i] || "").includes(label)) return i;
        }

        return -1;
      }

      function applyNarrowColumnWidths_(headerList, narrowColIndexes, theadRowEl, tbodyEl, referenceLabel, widthPlan) {
        const headerCells = theadRowEl.querySelectorAll("th");
        const refIndex = findHeaderIndex_(headerList, referenceLabel || NARROW_WIDTH_REFERENCE_LABEL);
        const refCell = refIndex !== -1 ? headerCells[refIndex + LEADING_COLUMNS] : null;
        const width = refCell ? Math.ceil(refCell.getBoundingClientRect().width) : NARROW_FALLBACK_WIDTH;

        narrowColIndexes.forEach(function(colIndex) {
          const th = headerCells[colIndex + LEADING_COLUMNS];
          if (th) {
            th.style.maxWidth = width + "px";
            th.style.width = width + "px";
          }

          tbodyEl.querySelectorAll("td:nth-child(" + (colIndex + LEADING_COLUMNS + 1) + ")").forEach(function(td) {
            td.style.maxWidth = width + "px";
            td.style.width = width + "px";
          });

          if (widthPlan) widthPlan[colIndex + LEADING_COLUMNS] = width;
        });
      }

      function isRowDirty(row) {
        for (let i = 0; i < row.loaded.length; i++) {
          if (String(row.loaded[i] ?? "") !== String(row.current[i] ?? "")) return true;
        }
        return false;
      }

      function updateDirtyState(rowPos, tr) {
        const row = state.rows[rowPos];
        tr.classList.toggle("dirty", isRowDirty(row));
        tr.classList.remove("conflict");
        updateDirtyCount();
      }

      function updateDirtyCount() {
        const dirtyRows = state.rows.filter(isRowDirty);
        el.dirtyCount.textContent = dirtyRows.length
          ? dirtyRows.length + "개 행 변경됨 (저장 전)"
          : "";
        el.saveRowsBtn.disabled = dirtyRows.length === 0 || state.loading;
      }

      async function saveDirtyRows() {
        if (isReadOnlyTab()) return;

        const dirtyRows = state.rows.filter(isRowDirty);

        if (!dirtyRows.length) return;

        const config = getConfig();
        setStatus("저장 중...", "");
        el.saveRowsBtn.disabled = true;

        try {
          const response = await fetch(config.url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              sheet: state.currentSheet,
              rows: dirtyRows.map(function(row) {
                return {
                  rowIndex: row.rowIndex,
                  key: row.loaded[KEY_COLUMN_INDEX],
                  values: row.current
                };
              })
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          state.header = data.header || state.header;
          state.rows = (data.rows || []).map(function(row) {
            return {
              rowIndex: row.rowIndex,
              loaded: row.values.slice(),

      function downloadBase64File_(base64, fileName) {
        const byteCharacters = atob(base64);
        const byteNumbers = new Array(byteCharacters.length);

        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }

        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

          "전월 마감이 끝났는지 확인해주세요.\n" +
          "월현황(주간) 연결 스프레드 시트 전체 데이터가 초기화 됩니다."
        )) return;

        setStatus("월자료 초기화 중...", "");
        el.clearMonthlyDataToolbarBtn.disabled = true;

        try {
          const response = await fetch(monthlyUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "clearMonthlyData" })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          setStatus("월자료 초기화 완료: " + (data.clearedSheets || []).length + "개 시트", "ok");
        } catch (error) {
          setStatus("월자료 초기화 실패: " + error.message, "error");
        } finally {
          el.clearMonthlyDataToolbarBtn.disabled = false;
        }
      }

      el.configPanelToggleBtn.addEventListener("click", function() {
        const willShow = el.configPanelBody.hidden;
        el.configPanelBody.hidden = !willShow;
        el.configPanelToggleBtn.textContent = willShow ? "접기" : "상세";
      });

      el.monthlyConfigPanelToggleBtn.addEventListener("click", function() {
        const willShow = el.monthlyConfigPanelBody.hidden;
        el.monthlyConfigPanelBody.hidden = !willShow;
        el.monthlyConfigPanelToggleBtn.textContent = willShow ? "접기" : "상세";
      });

      el.dailyConfigPanelToggleBtn.addEventListener("click", function() {
        const willShow = el.dailyConfigPanelBody.hidden;
        el.dailyConfigPanelBody.hidden = !willShow;
        el.dailyConfigPanelToggleBtn.textContent = willShow ? "접기" : "상세";
      });

      el.saveMonthlyClosingConfigBtn.addEventListener("click", saveMonthlyClosingConfig);
      el.saveDailyPackagingConfigBtn.addEventListener("click", saveDailyPackagingConfig);
      el.saveDailyReceiptConfigBtn.addEventListener("click", saveDailyReceiptConfig);
      el.saveDailyReceiptStatusConfigBtn.addEventListener("click", saveDailyReceiptStatusConfig);
      el.saveDailyRecoveryConfigBtn.addEventListener("click", saveDailyRecoveryConfig);
      el.saveDailyRecoveryAccumulateConfigBtn.addEventListener("click", saveDailyRecoveryAccumulateConfig);
      el.saveDailyServiceShipmentConfigBtn.addEventListener("click", saveDailyServiceShipmentConfig);
      el.dailyServiceShipmentReplaceBtn.addEventListener("click", replaceDailyServiceShipmentData);
      el.dailyServiceShipmentCleanBtn.addEventListener("click", runDailyServiceShipmentClean);
      el.dailyServiceShipmentResultViewBtn.addEventListener("click", function() {
        const isActive = el.dailyServiceShipmentResultViewBtn.classList.toggle("active");
        el.dailyServiceShipmentResultActions.classList.toggle("visible", isActive);

        if (isActive) {
          viewDailyServiceShipmentResult_();
        } else {
          resetDailyTableView_();
        }
      });
      el.dailyServiceShipmentResultDeleteBtn.addEventListener("click", deleteDailyServiceShipmentCheckedRows);
      el.dailyServiceShipmentResultSaveBtn.addEventListener("click", saveDailyServiceShipmentResultEdits);
      el.dailyServiceShipmentResultDownloadBtn.addEventListener("click", downloadDailyServiceShipmentResultExcel);
      el.dailyRecoveryAccumulateBtn.addEventListener("click", openDailyRecoveryAccumulateSheet);
      // "반납내역서"/"정리결과"는 서로 다른 표를 같은 자리에 보여주는
      // 관계라, 하나를 켜면 다른 하나는 꺼지게 합니다("정리결과"만
      // 저장/다운로드/누적저장 버튼 줄(dailyRecoveryResultActions)이 같이 뜸).
      el.dailyRecoveryViewBtn.addEventListener("click", function() {
        const isActive = el.dailyRecoveryViewBtn.classList.toggle("active");

        if (isActive) {
          el.dailyRecoveryResultViewBtn.classList.remove("active");
          el.dailyRecoveryResultActions.classList.remove("visible");
          viewDailyRecoveryDoc_();
        }
      });
      el.dailyRecoveryReplaceBtn.addEventListener("click", replaceDailyRecoveryData);
      el.dailyRecoveryCleanRunBtn.addEventListener("click", runDailyRecoveryClean);
      el.dailyRecoveryResultViewBtn.addEventListener("click", function() {
        const isActive = el.dailyRecoveryResultViewBtn.classList.toggle("active");
        el.dailyRecoveryResultActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyRecoveryViewBtn.classList.remove("active");
          viewDailyRecoveryResult_();
        }
      });
      el.dailyRecoveryResultSaveBtn.addEventListener("click", saveDailyRecoveryResultEdits);
      el.dailyRecoveryResultDownloadBtn.addEventListener("click", downloadDailyRecoveryResultExcel);
      el.dailyPackagingReplaceBtn.addEventListener("click", replaceDailyPackagingData);
      el.dailyPackagingDateCheckBtn.addEventListener("click", checkDailyPackagingDate);
      el.dailyPackagingDownloadBtn.addEventListener("click", downloadDailyPackagingExcel);
      el.monthlyClosingFactory2Btn.addEventListener("click", function() {
        const isActive = el.monthlyClosingFactory2Btn.classList.toggle("active");
        el.monthlyClosingFactory2Actions.classList.toggle("visible", isActive);
      });

      // 일일접수현황 탭을 새로 켤 때는, 그 안의 하위 보기(포장일자확인 등)
      // 상태를 깨끗하게 초기화해서 다음에 들어올 때 항상 기본 상태로
      // 시작하게 합니다(포장일자확인 버튼 자체는 이제 이 탭 안에 있어서
      // 서로 숨기는 관계가 아니라, 하위 보기 중 하나로 같이 있습니다).
      el.dailyReceiptStatusToggleBtn.addEventListener("click", function() {
        const isActive = el.dailyReceiptStatusToggleBtn.classList.toggle("active");
        el.dailyReceiptStatusActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyPackagingDateCheckToggleBtn.classList.remove("active");
          el.dailyPackagingActions.classList.remove("visible");
          el.dailyRecoveryStatusToggleBtn.classList.remove("active");
          el.dailyRecoveryStatusActions.classList.remove("visible");
          el.dailyServiceShipmentToggleBtn.classList.remove("active");
          el.dailyServiceShipmentActions.classList.remove("visible");
        }

        resetDailyTableView_();
      });

      // "일일회수현황" 탭 — 일일접수현황과는 서로 다른 영역이라 동시에
      // 켜져 있을 필요가 없어서, 하나를 켜면 다른 하나는 꺼지게 합니다.
      el.dailyRecoveryStatusToggleBtn.addEventListener("click", function() {
        const isActive = el.dailyRecoveryStatusToggleBtn.classList.toggle("active");
        el.dailyRecoveryStatusActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyReceiptStatusToggleBtn.classList.remove("active");
          el.dailyReceiptStatusActions.classList.remove("visible");
          el.dailyPackagingDateCheckToggleBtn.classList.remove("active");
          el.dailyPackagingActions.classList.remove("visible");
          el.dailyServiceShipmentToggleBtn.classList.remove("active");
          el.dailyServiceShipmentActions.classList.remove("visible");
        }

        resetDailyTableView_();
      });

      // "금일서비스출고건" 탭 — 버튼만 만들어둔 상태(리스트교체/리스트
      // 정리 기능은 아직 미구현, 추후 요청 시 추가 예정).
      el.dailyServiceShipmentToggleBtn.addEventListener("click", function() {
        const isActive = el.dailyServiceShipmentToggleBtn.classList.toggle("active");
        el.dailyServiceShipmentActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyReceiptStatusToggleBtn.classList.remove("active");
          el.dailyReceiptStatusActions.classList.remove("visible");
          el.dailyRecoveryStatusToggleBtn.classList.remove("active");
          el.dailyRecoveryStatusActions.classList.remove("visible");
          el.dailyPackagingDateCheckToggleBtn.classList.remove("active");
          el.dailyPackagingActions.classList.remove("visible");
        }

        resetDailyTableView_();
      });

      el.dailyManualBtn.addEventListener("click", showDailyManual_);
      el.monthlyRegularTaskManualBtn.addEventListener("click", showMonthlyRegularTaskManual_);

      el.dailyReceiptStatusReplaceBtn.addEventListener("click", replaceDailyReceiptStatusData);
      el.dailyReceiptStatusCheckAddedBtn.addEventListener("click", async function() {
        const isVisible = el.dailyCheckAddedConfirmRow.classList.toggle("visible");
        el.dailyAddedEntriesTabs.classList.toggle("visible", isVisible);
        el.dailyReceiptStatusCheckAddedBtn.classList.toggle("active", isVisible);

        if (isVisible) {
          el.dailyMeetingMaterialViewBtn.classList.remove("active");
          el.dailyMeetingMaterialActions.classList.remove("visible");
          el.dailyPackagingDateCheckToggleBtn.classList.remove("active");
          el.dailyPackagingActions.classList.remove("visible");

          const activeTab = el.dailyAddedEntriesTabs.querySelector("button[data-sheet].active");
          const tabToLoad = activeTab || el.dailyAddedEntriesTabs.querySelector("button[data-sheet]");
          if (tabToLoad) await selectDailyAddedEntriesTab_(tabToLoad);
        }
      });
      el.dailyCheckAddedConfirmBtn.addEventListener("click", checkDailyAddedEntries);
      el.dailyMeetingMaterialViewBtn.addEventListener("click", async function() {
        const isActive = el.dailyMeetingMaterialViewBtn.classList.toggle("active");
        el.dailyMeetingMaterialActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyReceiptStatusCheckAddedBtn.classList.remove("active");
          el.dailyCheckAddedConfirmRow.classList.remove("visible");
          el.dailyAddedEntriesTabs.classList.remove("visible");
          el.dailyPackagingDateCheckToggleBtn.classList.remove("active");
          el.dailyPackagingActions.classList.remove("visible");
          await viewDailyMeetingMaterial_();
        }
      });
      el.dailyMeetingMaterialDeletePreviousBtn.addEventListener("click", deletePreviousDaysMeetingMaterial);
      el.dailyMeetingMaterialSaveBtn.addEventListener("click", saveDailyMeetingMaterialEdits);
      el.dailyMeetingMaterialDeleteBtn.addEventListener("click", deleteDailyMeetingMaterialCheckedRows);
      el.dailyMeetingMaterialDownloadBtn.addEventListener("click", downloadMeetingMaterialExcel);
      el.dailyReceiptAccumulateBtn.addEventListener("click", accumulateDailyReceiptData);
      el.dailyAddedEntriesTabs.querySelectorAll("button[data-sheet]").forEach(function(tabBtn) {
        tabBtn.addEventListener("click", function() { selectDailyAddedEntriesTab_(tabBtn); });
      });
      el.dailyMoveToSavedBtn.addEventListener("click", saveDailyAddedEntriesToMeetingMaterial);
      el.dailyShowOnlyMaterialBtn.addEventListener("click", function() {
        dailyShowOnlyMaterialActive = !dailyShowOnlyMaterialActive;
        el.dailyShowOnlyMaterialBtn.classList.toggle("active", dailyShowOnlyMaterialActive);

        if (dailyShowOnlyMaterialActive && dailyHideMaterialActive) {
          dailyHideMaterialActive = false;
          el.dailyHideMaterialBtn.classList.remove("active");
        }

        redrawDailyTable_();
      });

      el.dailyHideMaterialBtn.addEventListener("click", function() {
        dailyHideMaterialActive = !dailyHideMaterialActive;
        el.dailyHideMaterialBtn.classList.toggle("active", dailyHideMaterialActive);

        if (dailyHideMaterialActive && dailyShowOnlyMaterialActive) {
          dailyShowOnlyMaterialActive = false;
          el.dailyShowOnlyMaterialBtn.classList.remove("active");
        }

        redrawDailyTable_();
      });

      el.dailyPackagingDateCheckToggleBtn.addEventListener("click", function() {
        const isActive = el.dailyPackagingDateCheckToggleBtn.classList.toggle("active");
        el.dailyPackagingActions.classList.toggle("visible", isActive);

        if (isActive) {
          el.dailyReceiptStatusCheckAddedBtn.classList.remove("active");
          el.dailyCheckAddedConfirmRow.classList.remove("visible");
          el.dailyAddedEntriesTabs.classList.remove("visible");
          el.dailyMeetingMaterialViewBtn.classList.remove("active");
          el.dailyMeetingMaterialActions.classList.remove("visible");
        }

        resetDailyTableView_();
      });

      el.monthlyClosingCarryOverBtn.addEventListener("click", carryOverPreviousMonth);

      el.monthlyClosingOpenSheetBtn.addEventListener("click", function() {
        const proceed = window.confirm(
          "진행상태 '입고일확정' 건은 출고확인 후에 입고완료 변경하거나 제외 해주세요.\n" +
          "기존 저장되어 있던 이번달시트 값을 전월시트에 복사 후에 금월데이터를 이번달시트에 복사해주세요."
        );
        if (!proceed) return;

        window.open(
          "https://docs.google.com/spreadsheets/d/" + MONTHLY_CLOSING_SPREADSHEET_ID + "/edit",
          "_blank"
        );
      });

      el.monthlyClosingCleanupAddedBtn.addEventListener("click", cleanupAddedItems);
      el.monthlyClosingCleanupByBrandBtn.addEventListener("click", cleanupByBrand);
      el.monthlyClosingDownloadBtn.addEventListener("click", downloadPaidClosing);
      el.monthlyClosingDownloadDetailBtn.addEventListener("click", downloadPaidClosingDetail);
      el.monthlyClosingSaveBtn.addEventListener("click", saveMonthlyClosingCleanupSheet);

      el.monthlyClosingTabs.forEach(function(tabBtn) {
        tabBtn.addEventListener("click", function() {
          el.monthlyClosingTabs.forEach(function(b) { b.classList.remove("active"); });
          tabBtn.classList.add("active");
          monthlyClosingCurrentSheet = tabBtn.dataset.monthlySheet;
          el.monthlyClosingSaveBtn.style.display =
            monthlyClosingCurrentSheet === MONTHLY_CLEANUP_SHEET_NAME ? "" : "none";
          loadMonthlyClosingData();
        });
      });

      el.saveConfigBtn.addEventListener("click", saveConfig);
      el.saveMonthlyConfigBtn.addEventListener("click", saveMonthlyConfig);
      el.saveRecoveryConfigBtn.addEventListener("click", saveRecoveryConfig);
      el.saveClaimDashboardConfigBtn.addEventListener("click", saveClaimDashboardConfig);
      el.saveClaimClosingArchiveConfigBtn.addEventListener("click", saveClaimClosingArchiveConfig);
      el.archiveWeekBtn.addEventListener("click", archiveWeek);
      el.downloadFullBtn.addEventListener("click", downloadFullWorkbook);
      el.downloadClaimDashboardBtn.addEventListener("click", downloadClaimDashboardWorkbook);
      el.reloadBtn.addEventListener("click", function() {
        if (!state.currentSheet) {
          setStatus("먼저 탭을 선택하세요.", "error");
          return;
        }
        loadSheet(state.currentSheet);
      });
      el.runCleanupBtn.addEventListener("click", runCleanup);
      el.saveRowsBtn.addEventListener("click", saveDirtyRows);

      el.recoveryMatchToolbarBtn.addEventListener("click", matchRecovery);
      el.accumulatedMatchToolbarBtn.addEventListener("click", matchAccumulatedData);
      el.clearMonthlyDataToolbarBtn.addEventListener("click", clearMonthlyData);

      el.openAsSheetToolbarBtn.addEventListener("click", function() {
        if (!confirm(
          "1공장 금주AS현황분석시트, 2공장 금주AS현황분석시트 모두 변경해주세요.\n\n" +
          "(마감은 전월 26일 ~ 금월 25일입니다. 전월 26일~금일(최대 25일)까지 자료인지 확인해주세요.)"
        )) return;
        window.open(AS_SPREADSHEET_EDIT_URL, "_blank");
      });

      el.cleanupBothToolbarBtn.addEventListener("click", runCleanupBoth);

      el.claimUpdateWeeklyBtn.addEventListener("click", updateClaimWeeklyCounts);
      el.claimReshapeMonthBtn.addEventListener("click", reshapeClaimMonth);

      el.removeDeletedToolbarBtn.addEventListener("click", removeDeletedEntries);

      el.tabs.forEach(function(tabBtn) {
        tabBtn.addEventListener("click", function() {
          el.tabs.forEach(function(b) { b.classList.remove("active"); });
          tabBtn.classList.add("active");
          loadSheet(tabBtn.dataset.sheet);
        });
      });

      const pageNavButtons = Array.from(document.querySelectorAll(".page-nav-btn"));
      const pageViews = {
        daily: document.getElementById("dailyPage"),
        weekly: document.getElementById("weeklyPage"),
        monthly: document.getElementById("monthlyPage")
      };

      pageNavButtons.forEach(function(btn) {
        btn.addEventListener("click", function() {
          const page = btn.dataset.page;

          pageNavButtons.forEach(function(b) { b.classList.toggle("active", b === btn); });

          Object.keys(pageViews).forEach(function(key) {
            pageViews[key].hidden = key !== page;
          });
        });
      });

      (async function bootstrap() {
        await loadConfig();
        // 기본 활성 탭을 두지 않음 — 탭을 직접 눌러야 그때 데이터를 불러옵니다.
      })();
    </script>
  </body>
</html>
